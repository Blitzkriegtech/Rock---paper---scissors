<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="main.css" />
    <title>JaJangKen</title>
</head>
<body>
    <header>
    <h1 class="header">ROCK 🤪 PAPER 😵 SCISSOR</h1>
    </header>
    
    <section class="score-board">
        <div class="tags" id="user-label">HERO</div>
        <span id="hero">0</span><span>:</span><span id="ai">0</span>
        <div class="tags" id="comp-label">AI</div>
        
    </section>

    <section class="result">
        <p id="resultText">GAME ON!</p>
    </section>

    <section class="choices">
        <button class="choice" id="rock">🪨</button>
        <button class="choice" id="paper">📜</button>
        <button class="choice" id="scissor">✂️</button>
    </section>

    <section class="para">
        <p class="text"> 👻 Grab a weapon 👻</p>
    </section>

    <div class="ultResult"></div>

<script src="main.js"></script>
</body>

</html>
